# -- Theme Options --
colorScheme = "blowfish"
defaultAppearance = "dark" # dark theme aesthetic as requested
autoSwitchAppearance = false

enableSearch = true
enableCodeCopy = true
enableStyledScrollbar = true

smartTOC = true
smartTOCHideUnfocusedChildren = false

# Thumbnail aspect ratio
thumbnailAspectRatio = "1.777"

[header]
  layout = "floating"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = false
  showScrollToTop = true

[homepage]
  layout = "custom"
  homepageImage = "images/hero-bg.jpg"
  showRecent = true
  showRecentItems = 6
  showMoreLink = true
  showMoreLinkDest = "posts"
  cardView = true
  cardViewScreenWidth = false

[article]
  showDate = true
  showWordCount = true
  showReadingTime = true
  showTaxonomies = true
  showTags = true
  showAuthor = true
  showDraftLabel = true
  showHeadingAnchors = true
  showPagination = true
  showTableOfContents = true
  showReadingProgress = true

[list]
  showSummary = true
  cardView = true
  groupByYear = false
  showTableOfContents = false
