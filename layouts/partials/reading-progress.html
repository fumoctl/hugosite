<div
  id="reading-progress"
  class="fixed left-0 top-0 z-[9999] h-[3.5px] w-0 print:hidden pointer-events-none"
  style="background: linear-gradient(90deg, #38bdf8, #818cf8, #a855f7); box-shadow: 0 0 10px rgba(56, 189, 248, 0.8), 0 0 20px rgba(168, 85, 247, 0.4); transition: width 0.08s ease-out;"
  aria-hidden="true"></div>
<script>
  (function() {
    const bar = document.getElementById("reading-progress");
    if (!bar) return;
    function updateProgress() {
      const scrollable = document.documentElement.scrollHeight - window.innerHeight;
      if (scrollable <= 0) {
        bar.style.width = "0%";
      } else {
        const pct = Math.min(100, Math.max(0, (window.scrollY / scrollable) * 100));
        bar.style.width = pct + "%";
      }
    }
    window.addEventListener("scroll", updateProgress, { passive: true });
    window.addEventListener("resize", updateProgress, { passive: true });
    updateProgress();
  })();
</script>
